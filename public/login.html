
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión | Ratatoulli</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="pagina-login">

    <!-- ENCABEZADO -->

    <header class="encabezado-login">

        <h2>Restaurante Ratatoulli</h2>

        <nav>
            <a href="index.html">Inicio</a>
            <a href="mesas.html">Mesas</a>
            <a href="menu.html">Menú</a>
            <a href="registro.html">Registrarse</a>
            <a href="login.html">Iniciar sesión</a>
        </nav>

    </header>

    <!-- FORMULARIO DE INICIO DE SESIÓN -->

    <main class="contenedor-login">

        <section class="tarjeta-login">

            <div class="titulo-login">

                <h1>Bienvenido de nuevo</h1>

                <p>
                    Inicia sesión para acceder
                    a tu cuenta de Ratatoulli.
                </p>

            </div>

            <!-- INFORMACIÓN DE LA MESA -->

            <div id="aviso-mesa-login"
                 class="aviso-mesa-login"
                 hidden>

                <strong>🍽️ Reservación pendiente</strong>

                <p id="texto-mesa-login"></p>

                <p>
                    Tu selección se conservará
                    mientras inicias sesión.
                </p>

            </div>

            <form id="form-login">

                <label for="correo-login">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo-login"
                    name="correo"
                    placeholder="ejemplo@correo.com"
                    autocomplete="email"
                    required
                >

                <label for="contrasena-login">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="contrasena-login"
                    name="contrasena"
                    placeholder="Ingrese su contraseña"
                    autocomplete="current-password"
                    required
                >

                <div class="mostrar-contrasena">

                    <input
                        type="checkbox"
                        id="ver-contrasena"
                    >

                    <label for="ver-contrasena">
                        Mostrar contraseña
                    </label>

                </div>

                <p id="mensaje-login"
                   role="status"
                   aria-live="polite"></p>

                <button type="submit"
                        class="btn-login">
                    Iniciar sesión
                </button>

            </form>

            <p class="texto-registro">

                ¿Todavía no tienes cuenta?

                <a href="registro.html"
                   id="enlace-registro-login">
                    Regístrate aquí
                </a>

            </p>

        </section>

    </main>

    <!-- PIE DE PÁGINA -->

    <footer class="footer-login">
        <p>© 2026 Restaurante Ratatoulli</p>
    </footer>

    <!-- JAVASCRIPT -->

    <script src="js/login.js"></script>
    <script src="js/login-mesa.js"></script>

</body>
</html>
