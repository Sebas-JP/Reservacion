<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú | Restaurante Ratatoulli</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h2>Restaurante Ratatoulli</h2>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="mesas.html">Mesas</a>
            <a href="menu.html">Menú</a>
            <a href="reservas.html">Reservar</a>
        </nav>
    </header>

    <main class="pagina-menu">

        <h1>Nuestro Menú del Día</h1>
        <p>Descubre los sabores de Francia.</p>

        <!-- Los platos se cargan aquí dinámicamente desde /api/menu -->
        <div class="contenedor-menu" id="contenedor-menu">
            <p id="cargando">Cargando menú...</p>
        </div>

        <div class="menu-reserva">
            <h2>¿Te gustaría visitarnos?</h2>
            <p>Reserva tu mesa y disfruta nuestro menú.</p>
            <a href="mesas.html" class="boton">Reservar una mesa</a>
        </div>

    </main>

    <footer>
        <p>© 2026 Restaurante Ratatoulli</p>
    </footer>

    <script>
        // Pide los platos a la API y los muestra en la página
        async function cargarMenu() {
            const contenedor = document.getElementById('contenedor-menu');

            try {
                const respuesta = await fetch('/api/menu');
                const platos = await respuesta.json();

                if (!platos.length) {
                    contenedor.innerHTML = '<p>No hay platos disponibles por el momento.</p>';
                    return;
                }

                // Genera una tarjeta por cada plato
                contenedor.innerHTML = platos.map(plato => `
                    <article class="plato">
                        <img src="${plato.imagen_url || 'img/default.jpg'}"
                             alt="${plato.nombre}">
                        <div class="plato-info">
                            <h2>${plato.nombre}</h2>
                            <p>${plato.descripcion || ''}</p>
                            <span class="precio">Q${Number(plato.precio).toFixed(2)}</span>
                        </div>
                    </article>
                `).join('');

            } catch (error) {
                contenedor.innerHTML = '<p>Error al cargar el menú. Intenta de nuevo más tarde.</p>';
                console.error('Error cargando menú:', error);
            }
        }

        cargarMenu();
    </script>

</body>
</html>
